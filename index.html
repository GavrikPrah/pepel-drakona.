<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПЕПЕЛ ДРАКОНА</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0d0b0a;
            --text-color: #e8e0d8;
            --accent-color: #c96a3a;
            --accent-hover: #a8562b;
            --panel-bg: #1a1614;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #2a1f1a 0%, #0d0b0a 70%);
        }

        h1, h2, h3 {
            font-family: 'Cinzel', serif;
            color: var(--text-color);
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            padding: 2rem;
            text-align: center;
        }

        .epigraph {
            font-style: italic;
            color: #999;
            margin-bottom: 3rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(201, 106, 58, 0.2);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            box-shadow: 0 6px 20px rgba(201, 106, 58, 0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid #444;
            color: #aaa;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: #222;
            border-color: #666;
            color: #fff;
            transform: none;
            box-shadow: none;
        }

        .user-info {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #888;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--panel-bg);
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #333;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #0a0908;
            border: 1px solid #333;
            color: #fff;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        .modal-content input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #333;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            color: #888;
            font-family: 'Cinzel', serif;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        .error-msg {
            color: #ff5555;
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: #555;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ПЕПЕЛ ДРАКОНА</h1>
        <div class="epigraph">"Здравствуй!Дорогой читатель."</div>
        
        <div id="auth-buttons">
            <button class="btn" onclick="openModal('login')">Войти</button>
            <button class="btn btn-secondary" onclick="openModal('register')">Регистрация</button>
        </div>

        <div id="game-buttons" style="display: none;">
           <a href="#" onclick="goToGame()" class="btn">Открыть Главу 1</a>
            <button class="btn btn-secondary" onclick="logout()">Выйти</button>
            <div class="user-info">Вы вошли как: <span id="user-name">...</span></div>
        </div>       
               <div style="margin-top: 3rem;">
            <a href="achievements.html" class="btn btn-secondary" style="font-size: 1rem; padding: 10px 25px;">🏆 Мои достижения</a>
        </div>
    </div>

    <div class="footer">Автор: Гаврик Никодимович Прах</div>

    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <div class="tabs">
                <div class="tab" id="tab-login" onclick="switchTab('login')">Вход</div>
                <div class="tab" id="tab-register" onclick="switchTab('register')">Регистрация</div>
            </div>
            
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div id="name-field" style="display: none;">
                    <input type="text" id="reg-name" placeholder="Имя героя">
                </div>
                <input type="email" id="auth-email" placeholder="Email" required>
                <input type="password" id="auth-password" placeholder="Пароль" required>
                <button type="submit" class="btn" style="width: 100%; margin: 15px 0 0 0;" id="submit-btn">Войти</button>
                <div class="error-msg" id="auth-error"></div>
            </form>
            <button class="btn btn-secondary" style="width: 100%; margin: 10px 0 0 0; font-size: 0.9rem; padding: 10px;" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://klsgzyzzfydnmhwoqpry.supabase.co';
        
        const SUPABASE_KEY = 'sb_publishable_rHT6cJEIwd5E9i71WLlllg_aH1Vtkc1'; 

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentMode = 'login';

        async function checkSession() {
            const { data: { session } } = await db.auth.getSession();
            updateUI(session);
        }

        function updateUI(session) {
            if (session) {
                document.getElementById('auth-buttons').style.display = 'none';
                document.getElementById('game-buttons').style.display = 'block';
                // Декодируем имя, если оно было закодировано
                const rawName = session.user.user_metadata.display_name;
                const name = rawName ? decodeURIComponent(rawName) : session.user.email;
                document.getElementById('user-name').innerText = name;
            } else {
                document.getElementById('auth-buttons').style.display = 'block';
                document.getElementById('game-buttons').style.display = 'none';
            }
        }

        function openModal(mode) {
            switchTab(mode);
            document.getElementById('auth-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('auth-error').style.display = 'none';
            document.getElementById('auth-form').reset();
        }

        function switchTab(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            const nameField = document.getElementById('name-field');
            const submitBtn = document.getElementById('submit-btn');

            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabReg.classList.remove('active');
                nameField.style.display = 'none';
                submitBtn.innerText = 'Войти';
            } else {
                tabLogin.classList.remove('active');
                tabReg.classList.add('active');
                nameField.style.display = 'block';
                submitBtn.innerText = 'Создать аккаунт';
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const name = document.getElementById('reg-name').value;
            const errorDiv = document.getElementById('auth-error');
            const submitBtn = document.getElementById('submit-btn');

            errorDiv.style.display = 'none';
            submitBtn.innerText = 'Загрузка...';
            submitBtn.disabled = true;

            try {
                if (currentMode === 'register') {
                    const { data, error } = await db.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: { display_name: encodeURIComponent(name) }
                        }
                    });
                    if (error) throw error;
                    
                    if (data.session) {
                        closeModal();
                        updateUI(data.session);
                    } else {
                        alert('Успех! Проверьте почту для подтверждения.');
                        closeModal();
                    }
                } else {
                    const { data, error } = await db.auth.signInWithPassword({
                        email: email,
                        password: password
                    });
                    if (error) throw error;
                    
                    closeModal();
                    updateUI(data.session);
                }
            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.style.display = 'block';
            } finally {
                submitBtn.innerText = currentMode === 'login' ? 'Войти' : 'Создать аккаунт';
                submitBtn.disabled = false;
            }
        }

        async function logout() {
            await db.auth.signOut();
            updateUI(null);
        }

    async function goToGame() {
    const { data: { session } } = await db.auth.getSession();
    if (session) {
        // Если есть сессия, переходим в игру
        window.location.href = 'game.html';
    } else {
        alert("Ошибка сессии. Пожалуйста, войдите заново.");
    }
}
    checkSession();
    </script>
</body>
</html>
